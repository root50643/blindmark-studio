name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify changelog mentions version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "## \\[$version\\]" CHANGELOG.md
      - name: Build backend image
        run: docker build -t "blindmark-backend:${GITHUB_REF_NAME}" backend
      - name: Build frontend image
        run: docker build -t "blindmark-frontend:${GITHUB_REF_NAME}" frontend
      - name: Export images
        run: |
          docker save "blindmark-backend:${GITHUB_REF_NAME}" | gzip > blindmark-backend.tar.gz
          docker save "blindmark-frontend:${GITHUB_REF_NAME}" | gzip > blindmark-frontend.tar.gz
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: |
            blindmark-backend.tar.gz
            blindmark-frontend.tar.gz
