name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Verify changelog mentions version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "## \\[$version\\]" CHANGELOG.md
      - name: Build backend image
        run: docker build -t "blindmark-backend:${GITHUB_REF_NAME}" backend
      - name: Build frontend image
        run: docker build -t "blindmark-frontend:${GITHUB_REF_NAME}" frontend
      - name: Export images
        run: |
          docker save "blindmark-backend:${GITHUB_REF_NAME}" | gzip > blindmark-backend.tar.gz
          docker save "blindmark-frontend:${GITHUB_REF_NAME}" | gzip > blindmark-frontend.tar.gz
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            blindmark-backend.tar.gz
            blindmark-frontend.tar.gz
